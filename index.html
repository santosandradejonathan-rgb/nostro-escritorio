<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vanessa · Comercial IA</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: cinematográfico e realista, uma agente de verdade olhando para você
   IDEA: o rosto da Vanessa é a central; circuitos levam até cada ferramenta
   PICTURE: retrato fotorrealista do androide, com luzes vivas por cima
   COLOUR and TYPE: preto, grafite, âmbar-dourado e azul-petróleo; Rajdhani em caixa alta
   LAYOUT: retrato ocupando a tela, ferramentas nas laterais, voz embaixo */
:root{color-scheme:dark;--ink:#EAF2F4;--mut:#8fa1a7;--or:#FFA436;--or2:#FFD08A;--cy:#3fd4e6;--bg:#04161b}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow:hidden}
main{position:fixed;inset:0}
main>svg{width:100%;height:100%;display:block}
header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:14px;padding:16px max(4vw,16px);z-index:2}
.logo{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--or);display:grid;place-items:center;font:700 17px Rajdhani,sans-serif;color:var(--or2);background:rgba(0,0,0,.4)}
.tit{font:700 22px/1 Rajdhani,sans-serif;letter-spacing:.06em}
.sub{font:600 12px/1 Rajdhani,sans-serif;color:var(--mut);letter-spacing:.08em;margin-top:4px}
.on-chip{margin-left:auto;display:flex;align-items:center;gap:8px;font:600 13px Rajdhani,sans-serif;letter-spacing:.08em;color:var(--mut)}
.on-chip i{width:8px;height:8px;border-radius:50%;background:var(--cy);animation:pisca 2s infinite}
footer{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:60px 16px 18px;z-index:2;background:linear-gradient(to top,rgba(2,8,10,.95) 30%,rgba(2,8,10,0))}
#estado{font:700 16px Rajdhani,sans-serif;letter-spacing:.14em;color:var(--or2);min-height:22px;text-shadow:0 0 12px rgba(255,164,54,.5)}
.wave{display:flex;align-items:center;gap:4px;height:34px}
.wave b{width:4px;height:4px;border-radius:2px;background:var(--or);opacity:.35;transition:height .12s,opacity .2s}
body.ouvindo .nota{font-size:12px;color:var(--mut)}
.trilha{fill:none;stroke:#FF9A2E;stroke-opacity:.28;stroke-width:2.5}
.fluxo{fill:none;stroke:var(--or);stroke-width:3;stroke-dasharray:12 44;opacity:.35;animation:corre 3s linear infinite}
.fluxo.on{opacity:1;stroke:var(--or2);stroke-width:4.5;animation-duration:.8s;filter:url(#brilho)}
@keyframes corre{to{stroke-dashoffset:-112}}
.no rect{fill:rgba(3,12,16,.78);stroke:#2a5059;stroke-width:1.5;transition:stroke .3s}
.no.on rect{stroke:var(--or2);stroke-width:2.6}
.no .mono{fill:none;stroke:var(--or);stroke-width:2}
.no .ab{font:700 17px Rajdhani,sans-serif;fill:var(--or2);text-anchor:middle}
.no .nm{font:700 21px Rajdhani,sans-serif;fill:var(--ink);letter-spacing:.06em}
.no .st{font:600 14px Rajdhani,sans-serif;fill:var(--mut);letter-spacing:.1em}
.no.on .st{fill:var(--or2)}
#nucleo{opacity:.55;transition:opacity .3s}
body.pensando #nucleo{opacity:1;animation:pisca .45s infinite}
@keyframes respira{50%{opacity:.35}}
@keyframes pisca{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (max-width:600px){.sub{display:none}}

/* JANELA: o painel holográfico onde a Vanessa mostra textos */
#janela{position:fixed;z-index:5;top:76px;bottom:120px;right:max(3vw,16px);width:min(520px,44vw);display:flex;flex-direction:column;
  background:linear-gradient(160deg,rgba(8,28,34,.92),rgba(3,12,16,.94) 60%);border:1px solid rgba(255,164,54,.38);border-radius:18px;
  box-shadow:0 0 0 1px rgba(63,212,230,.08) inset,0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(255,140,40,.12);backdrop-filter:blur(14px);
  opacity:0;transform:translateX(30px) scale(.97);filter:blur(6px);pointer-events:none;transition:opacity .45s,transform .55s cubic-bezier(.2,.9,.25,1.1),filter .45s;overflow:hidden}
#janela.aberta{opacity:1;transform:none;filter:none;pointer-events:auto}
#janela::before{content:"";position:absolute;left:0;right:0;top:-40%;height:40%;background:linear-gradient(to bottom,rgba(255,190,110,0),rgba(255,190,110,.09),rgba(255,190,110,0));pointer-events:none}
#janela.aberta::before{animation:varre 1.1s ease-out}
@keyframes varre{to{top:110%}}
#janela .canto{position:absolute;width:18px;height:18px;border-color:var(--or2);border-style:solid;opacity:.85;pointer-events:none}
#janela .c1{top:8px;left:8px;border-width:2px 0 0 2px;border-radius:6px 0 0 0}
#janela .c2{top:8px;right:8px;border-width:2px 2px 0 0;border-radius:0 6px 0 0}
#janela .c3{bottom:8px;left:8px;border-width:0 0 2px 2px;border-radius:0 0 0 6px}
#janela .c4{bottom:8px;right:8px;border-width:0 2px 2px 0;border-radius:0 0 6px 0}
.jtopo{display:flex;align-items:flex-start;gap:12px;padding:22px 24px 14px;border-bottom:1px solid rgba(255,164,54,.16)}
.jselo{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,rgba(255,200,120,.35),rgba(255,140,40,.06));border:1px solid rgba(255,164,54,.5);color:var(--or2);font:700 15px Rajdhani,sans-serif}
.jtit{font:700 20px/1.15 Rajdhani,sans-serif;letter-spacing:.07em;color:var(--ink);text-transform:uppercase}
.jsub{font:600 12px/1 Rajdhani,sans-serif;letter-spacing:.12em;color:var(--mut);margin-top:6px}
.jsub b{color:var(--cy);font-weight:600}
.jfecha{margin-left:auto;flex:none;width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);color:var(--mut);font:400 20px/1 system-ui;cursor:pointer;display:grid;place-items:center;transition:all .2s}
.jfecha:hover{color:var(--ink);border-color:var(--or)}
.jcorpo{flex:1;overflow:auto;padding:18px 26px 22px;font:400 16px/1.7 Inter,system-ui,sans-serif;color:#dfe9ec;outline:none;white-space:pre-wrap;word-wrap:break-word;scrollbar-width:thin;scrollbar-color:rgba(255,164,54,.35) transparent}
.jcorpo:focus{box-shadow:inset 0 0 0 1px rgba(63,212,230,.25)}
.jcorpo .h{display:block;font:700 14px/1.3 Rajdhani,sans-serif;letter-spacing:.14em;color:var(--or2);margin:6px 0 2px}
.jcorpo .li{display:block;padding-left:18px;position:relative}
.jcorpo .li::before{content:"";position:absolute;left:3px;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--or);box-shadow:0 0 8px var(--or)}
.jcorpo .vazia{display:block;height:.6em}
.jbase{display:flex;align-items:center;gap:10px;padding:14px 18px 18px;border-top:1px solid rgba(255,164,54,.16)}
.jbt{border:1px solid rgba(255,164,54,.45);background:rgba(255,164,54,.07);color:var(--or2);font:700 14px/1 Rajdhani,sans-serif;letter-spacing:.12em;padding:11px 16px;border-radius:11px;cursor:pointer;transition:all .2s;white-space:nowrap}
.jbt:hover{background:rgba(255,164,54,.16);box-shadow:0 0 18px rgba(255,164,54,.25)}
.jbt.prim{background:linear-gradient(180deg,#FFB24F,#F08A1C);color:#1b0f02;border-color:transparent}
.jbt.prim:hover{box-shadow:0 0 24px rgba(255,164,54,.55)}
.jbt.ok{background:rgba(63,212,230,.15);color:var(--cy);border-color:rgba(63,212,230,.5)}
.jnav{margin-left:auto;display:flex;align-items:center;gap:6px;font:600 13px Rajdhani,sans-serif;letter-spacing:.1em;color:var(--mut)}
.jnav button{width:30px;height:30px;border-radius:9px;border:1px solid rgba(255,255,255,.12);background:transparent;color:var(--ink);cursor:pointer;font:600 16px/1 system-ui}
.jnav button:disabled{opacity:.25;cursor:default}
.jdica{font:500 11px/1 Rajdhani,sans-serif;letter-spacing:.1em;color:#5f7379;padding:0 26px 10px;text-align:right}
#feixe{position:fixed;z-index:4;height:2px;pointer-events:none;transform-origin:0 50%;background:linear-gradient(90deg,rgba(255,208,138,0),rgba(255,208,138,.9),rgba(63,212,230,.7));filter:drop-shadow(0 0 6px rgba(255,164,54,.8));opacity:0;transition:opacity .5s}
body.comjanela #feixe{opacity:.75}
#nos .no{transition:opacity .5s}body.comjanela #nos .no.dir{opacity:.12}
@media (max-height:720px){.jtopo{padding:16px 22px 10px}.jcorpo{padding:12px 24px 14px;font-size:15px}.jbase{padding:10px 16px 12px}.jdica{display:none}}
@media (max-width:900px){#janela{left:12px;right:12px;width:auto;top:auto;bottom:150px;height:58vh}#feixe{display:none}}
</style>

<script>
{
const NS='http://www.w3.org/2000/svg';
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
const ferramentas=[
  {id:'hub',ab:'HUB',nome:'NOSTRO HUB',st:'CONECTADO',l:'e'},
  {id:'busca',ab:'LD',nome:'BUSCA DE LEADS',st:'CONECTADO',l:'e'},
  {id:'insta',ab:'IG',nome:'INSTAGRAM',st:'CONECTADO',l:'e'},
  {id:'face',ab:'FB',nome:'FACEBOOK',st:'CONECTADO',l:'e'},
  {id:'ads',ab:'AD',nome:'ANÚNCIOS META',st:'CONECTADO',l:'e'},
  {id:'drive',ab:'DR',nome:'GOOGLE DRIVE',st:'CONECTADO',l:'d'},
  {id:'whats',ab:'WA',nome:'WHATSAPP',st:'EM APROVAÇÃO',l:'d'},
  {id:'gmail',ab:'GM',nome:'GMAIL',st:'A LIGAR',l:'d'},
  {id:'agenda',ab:'AG',nome:'AGENDA',st:'A LIGAR',l:'d'},
  {id:'canva',ab:'CV',nome:'CANVA',st:'EM BREVE',l:'d'}
];
// posição de cada nó e do circuito que sai do rosto até ele (5 de cada lado)
{const YS=[130,270,410,550,690],SAIDA=[[600,200],[560,290],[575,400],[600,510],[640,610]];let ie=0,id=0;
  for(const f of ferramentas){const k=f.l==='e'?ie++:id++,y=YS[k],[sx,sy]=SAIDA[k],v=k%2?430:470;
    if(f.l==='e'){f.x=190+(k%2?-10:10);f.y=y;f.t=`${sx},${sy} ${v},${sy} ${v},${y} ${f.x+145},${y}`}
    else{f.x=1482-(k%2?-10:10);f.y=y;const X=1690-sx,V=1690-v;f.t=`${X},${sy} ${V},${sy} ${V},${y} ${f.x-145},${y}`}}}
const tr=document.getElementById('trilhas'),nos=document.getElementById('nos');
for(const f of ferramentas){
  el('polyline',{points:f.t,class:'trilha'},tr);
  f.fluxo=el('polyline',{points:f.t,class:'fluxo'},tr);
  const ini=f.t.split(' ')[0].split(',');el('circle',{cx:ini[0],cy:ini[1],r:5,fill:'#FFD08A',filter:'url(#brilho)'},tr);
  const g=el('g',{class:'no'+(f.l==='d'?' dir':'')},nos);
  el('rect',{x:f.x-145,y:f.y-36,width:290,height:72,rx:16},g);
  el('circle',{cx:f.x-108,cy:f.y,r:23,class:'mono'},g);
  el('text',{x:f.x-108,y:f.y+6,class:'ab'},g).textContent=f.ab;
  el('text',{x:f.x-74,y:f.y-2,class:'nm'},g).textContent=f.nome;
  el('text',{x:f.x-74,y:f.y+20,class:'st'},g).textContent=f.st;
  f.g=g;
}
const SUPA='https://isfyxyoelqmncqxcrvlx.supabase.co',KEY='sb_publishable_Y04pYZRNwX75XI8E29qL8w_TFTmrE4Z';
const FN_AGENTE=SUPA+'/functions/v1/agente',FN_VOZ=SUPA+'/functions/v1/voz',AG='calebe',PESSOA='jonathan';
const estado=document.getElementById('estado'),corpo=document.body,nota=document.getElementById('nota');
const onda=document.getElementById('onda');const barras=[];
for(let i=0;i<28;i++){const b=document.createElement('b');onda.appendChild(b);barras.push(b)}
let atual='',nivel=0,nivelMic=0;
const fase=(nome,texto)=>{atual=nome;corpo.className=nome;estado.textContent=texto};
const liga=ids=>ferramentas.forEach(f=>{const on=ids.includes(f.id);f.g.classList.toggle('on',on);f.fluxo.classList.toggle('on',on)});
const MAPA=[['hub',/funil|hub|lead|card|neg[oó]cio|cliente|etapa/i],['busca',/busc|procur|lista|empresa|gera[cç][aã]o|triagem|analis|prospec/i],['whats',/whats|zap|mensagem/i],['drive',/drive|arquivo|pasta/i],['gmail',/e-?mail|gmail/i],['agenda',/agenda|reuni[aã]o|marc|hor[aá]rio/i],['insta',/instagram|insta\b|seguidor|direct|reels|stories/i],['face',/facebook|p[aá]gina|messenger|coment[aá]rio|post|publica/i],['ads',/an[uú]ncio|campanha|tr[aá]fego|or[cç]amento|gasto|ads\b|conjunto/i],['canva',/canva/i]];
const ferramentasDe=t=>{const ids=MAPA.filter(([,re])=>re.test(t)).map(([id])=>id);return ids.length?ids:['hub']};

let actx=null,analis=null,dadosA=null;
function prepAudio(){if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)();analis=actx.createAnalyser();analis.fftSize=512;dadosA=new Uint8Array(analis.fftSize);analis.connect(actx.destination)}catch(e){}}if(actx&&actx.state==='suspended')actx.resume().catch(()=>{})}
setInterval(()=>{
  if(analis&&atual==='falando'){analis.getByteTimeDomainData(dadosA);let s=0;for(const v of dadosA){const x=(v-128)/128;s+=x*x}nivel=Math.min(1,Math.sqrt(s/dadosA.length)*4.5)}else nivel*=.8;
  nivelMic*=.82;const lv=atual==='falando'?nivel:atual==='ouvindo'?Math.max(.08,nivelMic):0;
  barras.forEach((b,i)=>{const h=4+lv*30*(.45+.55*Math.abs(Math.sin(Date.now()/160+i*.8)))+(lv>.05?Math.random()*5:0);b.style.height=h.toFixed(0)+'px';b.style.opacity=lv>.05?.9:.35})},70);

let VOZ_ESC='';fetch(SUPA+'/rest/v1/escritorio_vozes?select=voz&agente=eq.'+AG,{headers:{apikey:KEY}}).then(r=>r.json()).then(j=>{if(j&&j[0])VOZ_ESC=j[0].voz}).catch(()=>{});
function memAdd(quem,texto){texto=String(texto||'').trim();if(!texto)return;fetch(SUPA+'/rest/v1/escritorio_memoria',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({agente:AG,pessoa:PESSOA,quem,texto:texto.slice(0,1200)})}).catch(()=>{})}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let mudo=false,conversa=false,sess=null,rec=null,buf='',interino='',tSil=null,tOcioso=null,ctl=null,fila=null,AUD=null,encerrarDepois=false;
const CONECTOR=/\b(e|de|do|da|que|pra|para|com|o|a|os|as|um|uma|no|na|em|mas|ou|se|porque|então|tipo|aí)$/i;
function ouvir(){
  if(!conversa)return;buf='';interino='';liga([]);
  if(mudo){paraDeOuvir();fase('mudo','MICROFONE DESLIGADO · ESPAÇO PARA LIGAR');return}
  fase('ouvindo','OUVINDO');
  clearTimeout(tOcioso);tOcioso=setTimeout(()=>{if(atual==='ouvindo'&&!buf&&!interino)encerrar()},90000);
  if(!rec){rec=new SR();rec.lang='pt-BR';rec.continuous=true;rec.interimResults=true;
    rec.onresult=e=>{if(atual!=='ouvindo')return;let fin='',inter='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)fin+=r[0].transcript+' ';else inter+=r[0].transcript}
      if(fin)buf+=fin;interino=inter;nivelMic=1;clearTimeout(tSil);const tudo=(buf+interino).trim();
      tSil=setTimeout(()=>{const t=(buf+' '+interino).replace(/\s+/g,' ').trim();if(t&&atual==='ouvindo')enviar(t)},CONECTOR.test(tudo)?2400:1400)};
    rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){conversa=false;fase('','LIBERE O MICROFONE NO NAVEGADOR')}};
    rec.onend=()=>{if(conversa&&atual==='ouvindo'){try{rec.start()}catch(e){}}}}
  try{rec.start()}catch(e){}}
function paraDeOuvir(){clearTimeout(tSil);clearTimeout(tOcioso);if(rec){try{rec.stop()}catch(e){}}}
function iniciar(){if(!SR){fase('','ABRA NO CHROME PARA FALAR COM A VANESSA');return}conversa=true;sess={inicio:new Date().toISOString(),msgs:[]};ouvir()}
function encerrar(){conversa=false;paraDeOuvir();pararTudo();fase('','TOQUE NA TELA OU APERTE ESPAÇO PARA CONVERSAR');liga([])}
function pararTudo(){if(ctl){try{ctl.abort()}catch(e){}ctl=null}fila=null;if(AUD){try{AUD.pause()}catch(e){}AUD=null}}
/* ---------- janela: o que a Vanessa mostra na tela ---------- */
const jan=document.getElementById('janela'),jtit=document.getElementById('jtit'),jcorpo=document.getElementById('jcorpo'),jhora=document.getElementById('jhora'),jpos=document.getElementById('jpos'),
  jant=document.getElementById('jant'),jprox=document.getElementById('jprox'),jcopiar=document.getElementById('jcopiar'),jdrive=document.getElementById('jdrive'),feixe=document.getElementById('feixe');
const JANELAS=[];let jIdx=-1;
const escHtml=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function formata(texto){
  return String(texto||'').replace(/\r/g,'').replace(/\*\*?([^*\n]+)\*\*?/g,'$1').split('\n').map(l=>{const t=l.trim();
    if(!t)return '<span class="vazia"></span>';
    if(t.length<=70&&/[A-ZÀ-Ú]/.test(t)&&t===t.toUpperCase()&&!/^[-•]/.test(t))return '<span class="h">'+escHtml(t.replace(/:$/,''))+'</span>';
    if(/^[-•–]\s+/.test(t))return '<span class="li">'+escHtml(t.replace(/^[-•–]\s+/,''))+'</span>';
    return escHtml(l)+'\n'}).join('').replace(/\n(?=<span class="(h|li|vazia)")/g,'')}
function guardaEdicao(){if(jIdx>=0)JANELAS[jIdx].html=jcorpo.innerHTML}
function mostraJanela(i){if(i<0||i>=JANELAS.length)return;guardaEdicao();jIdx=i;const j=JANELAS[i];
  jtit.textContent=j.titulo;jhora.textContent=j.hora;jcorpo.innerHTML=j.html;jcorpo.scrollTop=0;
  jpos.textContent=(i+1)+'/'+JANELAS.length;jant.disabled=i===0;jprox.disabled=i===JANELAS.length-1;
  jcopiar.textContent='COPIAR';jcopiar.classList.remove('ok');
  jan.classList.remove('aberta');void jan.offsetWidth;jan.classList.add('aberta');jan.setAttribute('aria-hidden','false');corpo.classList.add('comjanela');posFeixe()}
function abreJanela(j){JANELAS.push({titulo:String(j.titulo||'VANESSA').toUpperCase(),hora:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),texto:String(j.texto||''),html:formata(j.texto)});mostraJanela(JANELAS.length-1)}
function fechaJanela(){guardaEdicao();jan.classList.remove('aberta');jan.setAttribute('aria-hidden','true');corpo.classList.remove('comjanela')}
function posFeixe(){const s=document.querySelector('main>svg'),r=s.getBoundingClientRect(),k=Math.min(r.width/1672,r.height/941),ox=r.left+(r.width-1672*k)/2,oy=r.top+(r.height-941*k)/2;
  const x1=ox+1000*k,y1=oy+330*k,b=jan.getBoundingClientRect(),x2=b.left,y2=b.top+b.height*.32;
  feixe.style.left=x1+'px';feixe.style.top=y1+'px';feixe.style.width=Math.max(0,Math.hypot(x2-x1,y2-y1))+'px';feixe.style.transform=`rotate(${Math.atan2(y2-y1,x2-x1)}rad)`}
addEventListener('resize',()=>{if(jan.classList.contains('aberta'))posFeixe()});
document.getElementById('jfecha').onclick=fechaJanela;
jant.onclick=()=>mostraJanela(jIdx-1);jprox.onclick=()=>mostraJanela(jIdx+1);
jcopiar.onclick=async()=>{const t=jcorpo.innerText.replace(/\n{3,}/g,'\n\n').trim();
  try{await navigator.clipboard.writeText(t)}catch(e){const r=document.createRange();r.selectNodeContents(jcorpo);const s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('copy');s.removeAllRanges()}
  jcopiar.textContent='COPIADO ✓';jcopiar.classList.add('ok');setTimeout(()=>{jcopiar.textContent='COPIAR';jcopiar.classList.remove('ok')},2200)};
jdrive.onclick=()=>{const j=JANELAS[jIdx];if(!j)return;prepAudio();if(!sess)sess={inicio:new Date().toISOString(),msgs:[]};
  pararTudo();enviar('Salva no Drive, como documento, o texto que está na janela "'+j.titulo+'". Texto final:\n'+jcorpo.innerText.trim().slice(0,12000))};
jan.addEventListener('pointerdown',e=>e.stopPropagation());
jan.addEventListener('keydown',e=>{if(e.key==='Escape'){e.stopPropagation();fechaJanela();jcorpo.blur()}else e.stopPropagation()});
window.vanessaJanela=abreJanela;

document.addEventListener('pointerdown',()=>{prepAudio();
  if(!conversa){iniciar();return}
  if(atual==='falando'||atual==='pensando'){pararTudo();ouvir()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&jan.classList.contains('aberta')){fechaJanela();return}
  if(e.key==='Escape'&&conversa){encerrar();return}
  if(e.code==='Space'&&!e.repeat){e.preventDefault();prepAudio();
    if(!conversa){mudo=false;iniciar();return}
    mudo=!mudo;
    if(mudo){if(atual==='ouvindo'){paraDeOuvir();fase('mudo','MICROFONE DESLIGADO · ESPAÇO PARA LIGAR')}}
    else if(atual==='mudo')ouvir()}});
window.vanessaTexto=t=>{prepAudio();if(!sess)sess={inicio:new Date().toISOString(),msgs:[]};enviar(String(t||''))};

const abrev=t=>t.replace(/\bDra\./g,'Doutora').replace(/\bDr\./g,'Doutor').replace(/\bSra\./g,'Senhora').replace(/\bSr\./g,'Senhor').replace(/\s&\s/g,' e ');
function audioDe(texto){return fetch(FN_VOZ,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agente:AG,texto,voz:VOZ_ESC||undefined})}).then(r=>r.ok?r.blob():null).catch(()=>null)}
function poeNaFila(f,texto){texto=abrev(texto).trim();if(!texto||fila!==f)return;f.itens.push(audioDe(texto));if(!f.tocando)toca(f)}
async function toca(f){if(fila!==f)return;const p=f.itens.shift();if(!p){f.tocando=false;if(f.acabou)terminouFala(f);return}f.tocando=true;
  const b=await p;if(fila!==f)return;if(!b){toca(f);return}
  const url=URL.createObjectURL(b),au=new Audio(url);AUD=au;
  try{if(actx&&analis)actx.createMediaElementSource(au).connect(analis)}catch(e){}
  if(atual!=='falando')fase('falando','VANESSA FALANDO');
  au.onended=au.onerror=()=>{URL.revokeObjectURL(url);if(AUD===au)AUD=null;toca(f)};
  au.play().catch(()=>{if(AUD===au)AUD=null;toca(f)})}
function terminouFala(f){if(fila!==f)return;fila=null;if(encerrarDepois){encerrarDepois=false;encerrar();return}if(conversa)setTimeout(()=>{if(conversa&&atual!=='ouvindo')ouvir()},350);else fase('','TOQUE NA TELA OU APERTE ESPAÇO PARA CONVERSAR')}
async function enviar(texto){
  paraDeOuvir();encerrarDepois=/^(tchau|at[eé] (mais|logo|amanh[aã])|pode encerrar|encerrar|desligar|valeu,? tchau)/i.test(texto);
  fase('pensando','PENSANDO');liga(ferramentasDe(texto));memAdd('u',texto);
  const ms=sess.msgs,ult=ms[ms.length-1];if(ult&&ult.role==='user')ult.content+=' '+texto;else ms.push({role:'user',content:texto});
  const meu=new AbortController();ctl=meu;const f={itens:[],tocando:false,acabou:false};fila=f;let total='',pend='';
  try{const r=await fetch(FN_AGENTE,{method:'POST',signal:meu.signal,headers:{'Content-Type':'application/json'},
      body:JSON.stringify({agente:AG,interlocutor:'Jonathan',pessoa:PESSOA,inicio:sess.inicio,sala:'janela da Vanessa no Hub',mensagens:ms.slice(-20),stream:true})});
    if(!r.ok||!r.body)throw new Error('sem resposta');
    const rd=r.body.getReader(),dec=new TextDecoder();let quadro=null;const mostradas=[];
    for(;;){const {value,done}=await rd.read();if(ctl!==meu)return;if(done)break;let t='';
      // separa a fala dos quadros de janela (entre \u001e e \u001f)
      for(const ch of dec.decode(value,{stream:true})){
        if(quadro!==null){if(ch==='\u001f'){try{const j=JSON.parse(quadro);abreJanela(j);mostradas.push(j)}catch(e){}quadro=null}else quadro+=ch}
        else if(ch==='\u001e')quadro='';else t+=ch}
      total+=t;pend+=t;
      let m;while((m=pend.match(/^([\s\S]*?[.!?…])\s+/))&&m[1].trim().length>=8){poeNaFila(f,m[1]);pend=pend.slice(m[0].length)}}
    ctl=null;total=total.trim();if(!total&&!mostradas.length)throw new Error('vazio');
    if(pend.trim())poeNaFila(f,pend);liga(ferramentasDe(texto+' '+total));
    const registro=total+mostradas.map(j=>'\n\n(Mostrei na tela, na janela "'+j.titulo+'":)\n'+j.texto).join('');
    ms.push({role:'assistant',content:registro});memAdd('a',registro);f.acabou=true;if(!f.tocando&&!f.itens.length)terminouFala(f)}
  catch(e){if(e.name==='AbortError')return;ctl=null;fila=null;fase('','NÃO CONSEGUI RESPONDER. TENTE DE NOVO');setTimeout(()=>{if(conversa)ouvir()},2200)}}

const nucleo=document.getElementById('nucleo'),corpoG=document.getElementById('corpoG'),cab=document.getElementById('cabeca'),palpE=document.getElementById('palpE'),palpD=document.getElementById('palpD'),olhos=document.getElementById('olhos');
const pose={r:0,x:0,y:0},alvo={r:0,x:0,y:0};let proxPose=0,proxPisc=performance.now()+1800,pisc=null;
const ri=(a,b)=>a+Math.random()*(b-a);
function novoAlvo(t){const st=corpo.className;
  if(st==='ouvindo'){alvo.r=ri(1.2,1.8)*(Math.random()<.5?-1:1);alvo.x=ri(-4,4);alvo.y=ri(2,5)}
  else{alvo.r=ri(-1,1);alvo.x=ri(-7,7);alvo.y=ri(-3,3)}
  proxPose=t+ri(1800,5200)}
function piscar(t){const dupla=Math.random()<.18;pisc={ini:t,dupla};proxPisc=t+ri(2400,6200)+(dupla?400:0)}
function fechamento(dt){const c=90,h=50,a=150;if(dt<0)return 0;if(dt<c)return dt/c;if(dt<c+h)return 1;if(dt<c+h+a)return 1-(dt-c-h)/a;return -1}
function quadro(t){
  if(t>proxPose)novoAlvo(t);
  const k=corpo.className==='ouvindo'?.035:.018;
  for(const q of ['r','x','y'])pose[q]+=(alvo[q]-pose[q])*k;
  const s=t/1000,fala=corpo.className==='falando';
  const micro=Math.sin(s*1.3)*.15+Math.sin(s*.7+1)*.12;
  const fase=(s%4.6)/4.6,ins=fase<.42?Math.sin(fase/.42*Math.PI/2):Math.cos((fase-.42)/.58*Math.PI/2);
  const resp=-ins*3.2;
  corpoG.setAttribute('transform',`translate(845 941) scale(${(1+ins*.009).toFixed(4)} ${(1+ins*.014).toFixed(4)}) translate(-845 -941)`);
  const aceno=fala?(Math.sin(s*7.5)*1.4+Math.sin(s*3.1)*.8)*(.4+nivel*1.6):0;nucleo.style.opacity=fala?(.45+nivel*.9).toFixed(2):'';
  cab.setAttribute('transform',`translate(${(pose.x+micro*4).toFixed(2)} ${(pose.y+resp+aceno).toFixed(2)}) rotate(${(pose.r+micro).toFixed(3)} 845 640)`);
  if(t>proxPisc&&!pisc)piscar(t);
  let f=0;if(pisc){const dt=t-pisc.ini;f=fechamento(dt);if(f<0&&pisc.dupla){f=fechamento(dt-320);if(f<0)pisc=null}else if(f<0)pisc=null;if(f<0)f=0}
  palpE.setAttribute('height',(f*62).toFixed(1));palpD.setAttribute('height',(f*63).toFixed(1));
  const base=corpo.className==='ouvindo'?.5:fala?.45+nivel*.6:.18;
  olhos.style.opacity=(base*(1-f)).toFixed(2);
  requestAnimationFrame(quadro)}
requestAnimationFrame(quadro);
const mudou=new MutationObserver(()=>{proxPose=0;if(corpo.className==='ouvindo'&&Math.random()<.6)proxPisc=performance.now()+250});mudou.observe(corpo,{attributes:true,attributeFilter:['class']});
}
