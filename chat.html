<!doctype html>
<html lang="pt-BR">
<head>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#EAF2F4;--mut:#8fa1a7;--or:#FFA436;--or2:#FFD08A;--cy:#3fd4e6;--bg:#04161b;--bg2:#0a2229;--linha:rgba(255,164,54,.22)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  background-image:radial-gradient(120% 60% at 50% -10%,rgba(255,164,54,.10),transparent 60%),radial-gradient(90% 50% at 50% 110%,rgba(63,212,230,.06),transparent 60%)}
header{flex:none;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:1px solid var(--linha);background:rgba(4,22,27,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.av{position:relative;width:44px;height:44px;flex:none}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:1.5px solid var(--or);box-shadow:0 0 14px rgba(255,164,54,.35)}
.av i{position:absolute;right:0;bottom:1px;width:11px;height:11px;border-radius:50%;background:var(--cy);border:2px solid var(--bg);animation:pisca 2.4s infinite}
.nm{font:700 21px/1 Rajdhani,sans-serif;letter-spacing:.08em;white-space:nowrap}
.st{font:600 12px/1 Rajdhani,sans-serif;letter-spacing:.12em;color:var(--mut);margin-top:5px;text-transform:uppercase}
.st.ativo{color:var(--or2)}
#nova{background:none;border:1px solid var(--linha);color:var(--or2);font:600 12px Rajdhani,sans-serif;letter-spacing:.1em;padding:8px 9px;border-radius:9px;white-space:nowrap}
#lista{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px 8px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.dia{align-self:center;font:600 11px Rajdhani,sans-serif;letter-spacing:.14em;color:var(--mut);padding:4px 10px;border:1px solid rgba(143,161,167,.2);border-radius:20px;margin:6px 0}
.m{max-width:84%;padding:9px 13px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;font-size:15.5px;line-height:1.45;animation:entra .22s ease-out}
.m.u{align-self:flex-end;background:linear-gradient(160deg,#2b2010,#1d1609);border:1px solid rgba(255,164,54,.45);color:#FFE7C2;border-bottom-right-radius:5px}
.m.a{align-self:flex-start;background:var(--bg2);border:1px solid rgba(255,164,54,.14);border-bottom-left-radius:5px}
.m.err{border-color:rgba(255,110,90,.5);color:#ffb3a6}
.m a{color:var(--cy)}
.h{display:block;font:600 10.5px Rajdhani,sans-serif;letter-spacing:.1em;opacity:.55;margin-top:3px;text-align:right}
.dig{display:inline-flex;gap:4px;padding:4px 2px}
.dig b{width:7px;height:7px;border-radius:50%;background:var(--or2);opacity:.4;animation:dig 1.1s infinite}
.dig b:nth-child(2){animation-delay:.15s}.dig b:nth-child(3){animation-delay:.3s}
.card{align-self:stretch;margin:2px 0 2px;border:1px solid var(--linha);border-radius:14px;background:linear-gradient(180deg,rgba(255,164,54,.07),rgba(10,34,41,.9) 70px);overflow:hidden;animation:entra .25s ease-out;position:relative}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--or),transparent)}
.ct{display:flex;align-items:center;gap:8px;padding:11px 12px 9px 15px;border-bottom:1px solid rgba(255,164,54,.12)}
.ct b{font:700 14px/1.15 Rajdhani,sans-serif;letter-spacing:.1em;color:var(--or2);flex:1}
.cp{flex:none;background:rgba(255,164,54,.12);border:1px solid rgba(255,164,54,.4);color:var(--or2);font:700 12px Rajdhani,sans-serif;letter-spacing:.12em;padding:7px 12px;border-radius:8px}
.cp.ok{background:var(--or);color:#1b1206}
.cb{padding:12px 14px 14px 15px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;font-size:15px;line-height:1.55;max-height:60vh;overflow-y:auto}
.cb.aberto{max-height:none}
.mais{display:block;width:100%;background:none;border:0;border-top:1px solid rgba(255,164,54,.12);color:var(--mut);font:600 12px Rajdhani,sans-serif;letter-spacing:.12em;padding:9px}
footer{flex:none;padding:8px 10px calc(env(safe-area-inset-bottom) + 10px);background:rgba(4,22,27,.92);border-top:1px solid var(--linha)}
#aviso{font:600 12px Rajdhani,sans-serif;letter-spacing:.1em;color:var(--or2);text-align:center;min-height:0;transition:.2s}
#aviso:not(:empty){padding:2px 0 7px}
.barra{display:flex;align-items:flex-end;gap:8px}
#txt{flex:1;resize:none;overflow-y:auto;scrollbar-width:none;max-height:140px;min-height:44px;padding:11px 14px;border-radius:22px;border:1px solid rgba(255,164,54,.3);background:#061d23;color:var(--ink);font:16px/1.35 Inter,system-ui,sans-serif;outline:none}
#txt::-webkit-scrollbar{display:none}
#txt:focus{border-color:var(--or)}
#txt::placeholder{color:#5d7279}
.bt{flex:none;width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center}
.bt svg{width:21px;height:21px}
#mic{background:#0d2a31;border:1px solid rgba(255,164,54,.35);color:var(--or2)}
#mic.on{background:#e5484d;border-color:#e5484d;color:#fff;animation:pulso 1.2s infinite}
#env{background:var(--or);color:#1b1206}
#env:disabled{opacity:.35}
.vazio{margin:auto;text-align:center;color:var(--mut);padding:30px 20px}
.vazio img{width:96px;height:96px;border-radius:50%;border:1.5px solid var(--or);box-shadow:0 0 30px rgba(255,164,54,.3);margin-bottom:14px}
.vazio b{display:block;font:700 22px Rajdhani,sans-serif;letter-spacing:.1em;color:var(--ink)}
.vazio span{font-size:14px}
/* áudio */
.m.au{display:grid;grid-template-columns:38px 1fr auto;align-items:center;column-gap:10px;min-width:230px;padding:8px 12px 6px 8px}
.play{width:38px;height:38px;border-radius:50%;border:0;background:var(--or);color:#1b1206;display:grid;place-items:center}
.play svg{width:16px;height:16px}
.ond{display:flex;align-items:center;gap:2px;height:30px}
.ond b{flex:1;min-width:2px;border-radius:2px;background:rgba(255,208,138,.35)}
.ond b.on{background:var(--or2)}
.dur{font:600 12px Rajdhani,sans-serif;letter-spacing:.06em;color:var(--or2)}
.tr{grid-column:1/-1;font-size:13px;line-height:1.4;color:#b9a78a;margin-top:6px;white-space:pre-wrap}
.tr.esp{font:600 11px Rajdhani,sans-serif;letter-spacing:.12em;color:var(--mut)}
.m.au .h{grid-column:1/-1}
#grav{display:none;align-items:center;gap:10px}
body.gravando #grav{display:flex} body.gravando .barra{display:none}
#lixo{background:#0d2a31;border:1px solid rgba(143,161,167,.35);color:#c9d6da}
#envA{background:var(--or);color:#1b1206}
.rec{flex:1;display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:22px;border:1px solid rgba(229,72,77,.55);background:#1a0f12}
.rec i{width:10px;height:10px;border-radius:50%;background:#e5484d;animation:pisca 1s infinite;flex:none}
#rel{font:700 15px Rajdhani,sans-serif;letter-spacing:.08em;color:#ffd7d8;flex:none;width:38px}
#vivo{flex:1;display:flex;align-items:center;gap:2px;height:26px;overflow:hidden;justify-content:flex-end}
#vivo b{width:3px;flex:none;border-radius:2px;background:#ff8f92}
/* ligação */
#ligar{background:var(--or);border:0;color:#1b1206;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
#ligar svg{width:20px;height:20px}
#nova{margin-left:auto}
#call{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 28px) 24px calc(env(safe-area-inset-bottom) + 30px);
  background:radial-gradient(90% 55% at 50% 38%,rgba(255,164,54,.16),transparent 70%),#030f13;touch-action:manipulation;user-select:none;-webkit-user-select:none}
body.ligado #call{display:flex}
.ctop{text-align:center}
.ctop b{display:block;font:700 30px/1 Rajdhani,sans-serif;letter-spacing:.12em}
#ctempo{font:600 16px Rajdhani,sans-serif;letter-spacing:.14em;color:var(--mut);margin-top:8px}
.cmeio{display:flex;flex-direction:column;align-items:center;gap:26px;width:100%}
.anel{position:relative;width:min(62vw,250px);aspect-ratio:1}
.anel img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid var(--or);z-index:2}
.anel i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--or);opacity:0}
#call.falando .anel i{animation:onda 1.6s infinite ease-out}#call.falando .anel i:nth-child(2){animation-delay:.53s}#call.falando .anel i:nth-child(3){animation-delay:1.06s}
#call.ouvindo .anel img{border-color:var(--cy);box-shadow:0 0 0 calc(var(--nv,0)*22px) rgba(63,212,230,.28),0 0 40px rgba(63,212,230,.35)}
#call.pensando .anel img{animation:resp 1.4s infinite ease-in-out}
#cest{font:700 26px/1.15 Rajdhani,sans-serif;letter-spacing:.14em;text-align:center;color:var(--or2);min-height:60px}
#call.ouvindo #cest{color:var(--cy)}
#cdica{font-size:14px;color:var(--mut);text-align:center;max-width:300px;min-height:40px}
.cbaixo{display:flex;align-items:center;justify-content:center;gap:42px}
.cb2{width:74px;height:74px;border-radius:50%;border:0;display:grid;place-items:center}
.cb2 svg{width:32px;height:32px}
#cmudo{background:#123039;color:#d5e3e7;border:1px solid rgba(143,161,167,.35)}
#cmudo.on{background:#EAF2F4;color:#04161b}
#cdesl{width:86px;height:86px;background:#e5484d;color:#fff;box-shadow:0 8px 30px rgba(229,72,77,.4)}
#cdesl svg{width:38px;height:38px;transform:rotate(135deg)}
@keyframes onda{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.55);opacity:0}}
@keyframes resp{50%{transform:scale(.96);opacity:.8}}
@keyframes pisca{50%{opacity:.4}}
@keyframes dig{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
@keyframes entra{from{opacity:0;transform:translateY(6px)}}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(229,72,77,.6)}100%{box-shadow:0 0 0 12px rgba(229,72,77,0)}}
</style>
</head>
<body>
<header>
  <div class="av"><img src="assets/vanessa-rosto.jpg" alt=""><i></i></div>
  <div><div class="nm">VANESSA IA</div><div class="st" id="st">ONLINE</div></div>
  <button id="nova" type="button">NOVA</button>
  <button id="ligar" type="button" aria-label="Ligar para a Vanessa"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></button>
</header>
<div id="lista"></div>
<footer>
  <div id="aviso"></div>
  <div id="grav">
    <button class="bt" id="lixo" type="button" aria-label="Cancelar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
    <div class="rec"><i></i><span id="rel">0:00</span><div id="vivo"></div></div>
    <button class="bt" id="envA" type="button" aria-label="Enviar áudio"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12 2-12 2z"/></svg></button>
  </div>
  <div class="barra">
    <button class="bt" id="mic" type="button" aria-label="Falar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <textarea id="txt" rows="1" placeholder="Fala com a Vanessa..." enterkeyhint="send"></textarea>
    <button class="bt" id="env" type="button" aria-label="Enviar" disabled><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12 2-12 2z"/></svg></button>
  </div>
</footer>
<div id="call" aria-live="polite">
  <div class="ctop"><b>VANESSA IA</b><div id="ctempo">LIGANDO...</div></div>
  <div class="cmeio"><div class="anel"><i></i><i></i><i></i><img src="assets/vanessa-rosto.jpg" alt=""></div><div id="cest">CONECTANDO</div><div id="cdica"></div></div>
  <div class="cbaixo">
    <button class="cb2" id="cmudo" type="button" aria-label="Silenciar microfone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button class="cb2" id="cdesl" type="button" aria-label="Desligar"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></button>
  </div>
</div>
<script>
const SUPA='https://isfyxyoelqmncqxcrvlx.supabase.co',KEY='sb_publishable_Y04pYZRNwX75XI8E29qL8w_TFTmrE4Z';
const FN_AGENTE=SUPA+'/functions/v1/agente',FN_TR=SUPA+'/functions/v1/transcrever',FN_VOZ=SUPA+'/functions/v1/voz',AG='calebe',PESSOA='jonathan';
const lista=document.getElementById('lista'),txt=document.getElementById('txt'),env=document.getElementById('env'),mic=document.getElementById('mic'),st=document.getElementById('st'),aviso=document.getElementById('aviso');
const GUARDA='vanessa-chat-v1',PAUSA=6*3600e3;
let H={msgs:[],ini:null};try{H=JSON.parse(localStorage.getItem(GUARDA))||H}catch(e){}
const salva=()=>{try{H.msgs=H.msgs.slice(-60);localStorage.setItem(GUARDA,JSON.stringify(H))}catch(e){}};
let ocupado=false;const AUDIOS={}; // áudios desta sessão, para tocar de novo

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkifica=s=>esc(s).replace(/https?:\/\/[^\s<]+/g,u=>'<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>');
const hora=t=>new Date(t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const diaDe=t=>{const d=new Date(t),hj=new Date();const o=new Date(Date.now()-864e5);
  if(d.toDateString()===hj.toDateString())return'HOJE';if(d.toDateString()===o.toDateString())return'ONTEM';
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})};
const rola=()=>requestAnimationFrame(()=>{lista.scrollTop=lista.scrollHeight});
function memAdd(quem,texto){texto=String(texto||'').trim();if(!texto)return;fetch(SUPA+'/rest/v1/escritorio_memoria',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({agente:AG,pessoa:PESSOA,quem,texto:('[Chat] '+texto).slice(0,1200)})}).catch(()=>{})}

const PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>',PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
function balao(quem,texto,t){const d=document.createElement('div');d.className='m '+quem;d.innerHTML=linkifica(texto)+(t?'<span class="h">'+hora(t)+'</span>':'');lista.appendChild(d);return d}
function balaoAudio(m){
  const d=document.createElement('div');d.className='m u au';
  const picos=(m.audio&&m.audio.picos&&m.audio.picos.length?m.audio.picos:Array(28).fill(.3));
  d.innerHTML='<button class="play" type="button" aria-label="Ouvir">'+PLAY+'</button><div class="ond">'+picos.map(v=>'<b style="height:'+Math.round(4+v*26)+'px"></b>').join('')+'</div><span class="dur">'+mmss(m.audio?m.audio.dur:0)+'</span>'
    +'<div class="tr'+(m.content?'':' esp')+'">'+(m.content?esc(m.content):'OUVINDO O ÁUDIO...')+'</div><span class="h">'+hora(m.t)+'</span>';
  const bt=d.querySelector('.play'),barras=[...d.querySelectorAll('.ond b')],dur=d.querySelector('.dur');let au=null;
  bt.onclick=()=>{const url=AUDIOS[m.t];if(!url){bt.style.opacity=.35;return}
    if(au&&!au.paused){au.pause();return}
    if(!au){au=new Audio(url);au.ontimeupdate=()=>{const f=au.currentTime/(au.duration&&isFinite(au.duration)?au.duration:m.audio.dur||1);barras.forEach((b,i)=>b.classList.toggle('on',i/barras.length<f));dur.textContent=mmss(au.currentTime)};
      au.onended=()=>{bt.innerHTML=PLAY;barras.forEach(b=>b.classList.remove('on'));dur.textContent=mmss(m.audio.dur)};au.onpause=()=>{bt.innerHTML=PLAY}}
    au.play().then(()=>{bt.innerHTML=PAUSE}).catch(()=>{})};
  if(!AUDIOS[m.t])bt.style.opacity=.35;
  lista.appendChild(d);return d}
function cartao(j){
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<div class="ct"><b></b><button class="cp" type="button">COPIAR</button></div><div class="cb"></div>';
  c.querySelector('b').textContent=j.titulo||'VANESSA';c.querySelector('.cb').textContent=j.texto||'';
  c.querySelector('.cp').onclick=e=>copia(j.texto||'',e.currentTarget);
  lista.appendChild(c);
  const cb=c.querySelector('.cb');requestAnimationFrame(()=>{if(cb.scrollHeight>cb.clientHeight+4){const m=document.createElement('button');m.className='mais';m.type='button';m.textContent='VER TUDO';m.onclick=()=>{cb.classList.add('aberto');m.remove()};c.appendChild(m)}});
  return c}
async function copia(t,b){let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(e){const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{ok=document.execCommand('copy')}catch(_){}a.remove()}
  if(ok){b.textContent='COPIADO';b.classList.add('ok');setTimeout(()=>{b.textContent='COPIAR';b.classList.remove('ok')},1800)}}
function vazio(){lista.innerHTML='<div class="vazio"><img src="assets/vanessa-rosto.jpg" alt=""><b>VANESSA IA</b><span>Pede o que precisar: leads, Instagram, anúncios, Drive, uma copy.<br>Toque no microfone para mandar áudio,<br>ou no telefone para falar em ligação.</span></div>'}
function separador(t){const s=document.createElement('div');s.className='dia';s.textContent=diaDe(t);lista.appendChild(s)}
function desenha(){lista.innerHTML='';if(!H.msgs.length)return vazio();let ult='';
  for(const m of H.msgs){const d=diaDe(m.t);if(d!==ult){separador(m.t);ult=d}
    if(m.role==='user'){if(m.audio)balaoAudio(m);else balao('u',m.content,m.t)}else{if(m.fala)balao('a',m.fala,m.t);(m.telas||[]).forEach(cartao)}}
  rola()}

function ajusta(){txt.style.height='auto';txt.style.height=Math.min(140,txt.scrollHeight)+'px';const tem=!!txt.value.trim();env.disabled=ocupado||!tem}
txt.addEventListener('input',ajusta);
txt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!/Mobi|Android|iPhone/i.test(navigator.userAgent)){e.preventDefault();manda()}});
env.onclick=()=>manda();
document.getElementById('nova').onclick=()=>{if(ocupado)return;if(H.msgs.length&&!confirmaNova())return;H={msgs:[],ini:null};salva();desenha()};
let tNova=0;function confirmaNova(){const b=document.getElementById('nova');if(Date.now()-tNova<2500){b.textContent='NOVA';return true}tNova=Date.now();b.textContent='DE NOVO?';setTimeout(()=>{b.textContent='NOVA'},2500);return false}
const status=(t,ativo)=>{st.textContent=t;st.classList.toggle('ativo',!!ativo)};

// manda texto, ou um áudio (que vira texto antes de ir para a Vanessa)
async function manda(texto,au){
  if(ocupado)return;
  if(!au){texto=(texto??txt.value).trim();if(!texto)return;txt.value='';ajusta()}
  const agora=Date.now(),ultima=H.msgs.length?H.msgs[H.msgs.length-1].t:0;
  if(!H.ini||agora-ultima>PAUSA)H.ini=new Date(agora).toISOString(); // conversa nova depois de 6 horas parada
  if(!H.msgs.length)lista.innerHTML='';
  if(diaDe(agora)!==(ultima?diaDe(ultima):''))separador(agora);
  ocupado=true;ajusta();
  const msg={role:'user',content:au?'':texto,t:agora};
  let bU;
  if(au){msg.audio={dur:au.dur,picos:au.picos};AUDIOS[agora]=au.url;bU=balaoAudio(msg);rola();status('OUVINDO SEU ÁUDIO...',true);
    try{const r=await fetch(FN_TR,{method:'POST',headers:{'Content-Type':au.blob.type||'audio/webm'},body:au.blob});const j=await r.json();texto=String(j.texto||'').trim();if(!r.ok&&!texto)throw new Error(j.erro||'falhou')}catch(e){texto=''}
    const tr=bU.querySelector('.tr');
    if(!texto){tr.className='tr esp';tr.textContent='NÃO CONSEGUI OUVIR. GRAVE DE NOVO.';ocupado=false;ajusta();status('ONLINE');return}
    tr.className='tr';tr.textContent=texto;msg.content=texto}
  else balao('u',texto,agora);
  H.msgs.push(msg);salva();memAdd('u',au?'(áudio) '+texto:texto);
  const desde=Date.parse(H.ini);
  const enviar=H.msgs.filter(m=>m.t>=desde).slice(-20).map(m=>({role:m.role,content:m.role==='user'?m.content:(m.fala||'')+(m.usou&&m.usou.length?'\n(ferramentas usadas: '+m.usou.join(', ')+')':'')+(m.telas||[]).map(j=>'\n\n(Mandei aqui no chat, no cartão "'+j.titulo+'":)\n'+j.texto).join('')}));
  status('DIGITANDO...',true);
  const bal=document.createElement('div');bal.className='m a';bal.innerHTML='<span class="dig"><b></b><b></b><b></b></span>';lista.appendChild(bal);rola();
  let fala='',quadro=null;const telas=[],cards=[],usadas=[];
  try{
    const r=await fetch(FN_AGENTE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agente:AG,canal:'chat',interlocutor:'Jonathan',pessoa:PESSOA,inicio:H.ini,sala:'chat no celular',mensagens:enviar,stream:true})});
    if(!r.ok||!r.body)throw new Error('sem resposta');
    const rd=r.body.getReader(),dec=new TextDecoder();
    for(;;){const {value,done}=await rd.read();if(done)break;let t='';
      for(const ch of dec.decode(value,{stream:true})){
        if(quadro!==null){if(ch==='\u001f'){try{const j=JSON.parse(quadro);if(j.usou)usadas.push(...j.usou);else{telas.push(j);cards.push(cartao(j));lista.appendChild(bal);rola()}}catch(e){}quadro=null}else quadro+=ch}
        else if(ch==='\u001e')quadro='';else t+=ch}
      if(t){fala+=t;if(fala.trim()){bal.innerHTML=linkifica(fala.trim());rola()}}}
    fala=fala.replace(/[ \t]+\n/g,'\n').trim();
    if(!fala&&!telas.length)throw new Error('vazio');
    const fim=Date.now();
    if(fala)bal.innerHTML=linkifica(fala)+'<span class="h">'+hora(fim)+'</span>';else bal.remove();
    if(fala&&cards.length)lista.insertBefore(bal,cards[0]); // a frase vem antes dos cartões, como no histórico
    const usou=[...new Set(usadas)];H.msgs.push({role:'assistant',fala,telas,usou,t:fim});salva();
    memAdd('a',fala+(usou.length?'\n(ferramentas usadas: '+usou.join(', ')+')':'')+telas.map(j=>'\n\n(Mandei no chat, no cartão "'+j.titulo+'":)\n'+j.texto).join(''));
  }catch(e){
    bal.classList.add('err');bal.textContent='Não consegui responder agora. Confere a internet e tenta de novo.';
    H.msgs.pop();salva();if(!au)txt.value=texto;
  }
  ocupado=false;ajusta();status('ONLINE');rola();
}

// áudio: grava como no WhatsApp (toque no microfone, fale, toque em enviar)
const rel=document.getElementById('rel'),vivo=document.getElementById('vivo');
let gr=null; // {rec, stream, pedacos, ini, picos, ctx, an, timer, cancelado}
function tipoAudio(){if(!window.MediaRecorder)return null;for(const t of['audio/webm;codecs=opus','audio/ogg;codecs=opus','audio/mp4','audio/webm'])if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))return t;return''}
async function comecaGravar(){
  if(ocupado||gr)return;const tipo=tipoAudio();
  if(tipo===null){aviso.textContent='ESTE NAVEGADOR NÃO GRAVA ÁUDIO. USE O MICROFONE DO TECLADO';setTimeout(()=>{aviso.textContent=''},4000);return}
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}
  catch(e){aviso.textContent='LIBERE O MICROFONE PARA ESTE SITE NAS CONFIGURAÇÕES';setTimeout(()=>{aviso.textContent=''},5000);return}
  const rec=tipo?new MediaRecorder(stream,{mimeType:tipo,audioBitsPerSecond:32000}):new MediaRecorder(stream);
  gr={rec,stream,pedacos:[],ini:Date.now(),niveis:[],cancelado:false};
  rec.ondataavailable=e=>{if(e.data&&e.data.size)gr&&gr.pedacos.push(e.data)};
  try{const C=window.AudioContext||window.webkitAudioContext;gr.ctx=new C();const src=gr.ctx.createMediaStreamSource(stream);gr.an=gr.ctx.createAnalyser();gr.an.fftSize=512;src.connect(gr.an)}catch(e){}
  vivo.innerHTML='';document.body.classList.add('gravando');if(navigator.vibrate)navigator.vibrate(30);
  const buf=new Uint8Array(512);
  gr.timer=setInterval(()=>{if(!gr)return;const s=(Date.now()-gr.ini)/1000;rel.textContent=mmss(s);
    let v=.15;if(gr.an){gr.an.getByteTimeDomainData(buf);let q=0;for(const x of buf){const y=(x-128)/128;q+=y*y}v=Math.min(1,Math.sqrt(q/buf.length)*5)}
    gr.niveis.push(v);const b=document.createElement('b');b.style.height=Math.round(3+v*23)+'px';vivo.appendChild(b);if(vivo.children.length>60)vivo.firstChild.remove();
    if(s>=300)terminaGravar(true)},100);
  rec.start(250);
}
function terminaGravar(enviar){
  if(!gr)return;const g=gr;gr=null;clearInterval(g.timer);document.body.classList.remove('gravando');
  g.rec.onstop=()=>{g.stream.getTracks().forEach(t=>t.stop());try{g.ctx&&g.ctx.close()}catch(e){}
    const dur=(Date.now()-g.ini)/1000;if(!enviar||dur<.8)return;
    const blob=new Blob(g.pedacos,{type:(g.rec.mimeType||'audio/webm').split(';')[0]});
    // 28 barrinhas com o volume do áudio
    const n=28,picos=[];for(let i=0;i<n;i++){const a=g.niveis.slice(Math.floor(i*g.niveis.length/n),Math.floor((i+1)*g.niveis.length/n));picos.push(+(a.length?Math.max(...a):.1).toFixed(2))}
    manda('',{blob,url:URL.createObjectURL(blob),dur,picos})};
  try{g.rec.stop()}catch(e){g.rec.onstop()}
}
mic.onclick=comecaGravar;
document.getElementById('envA').onclick=()=>terminaGravar(true);
document.getElementById('lixo').onclick=()=>terminaGravar(false);


// ---------- LIGAÇÃO: fala, ela entende quando você parou, responde em voz e volta a ouvir ----------
const callEl=document.getElementById('call'),cest=document.getElementById('cest'),cdica=document.getElementById('cdica'),ctempo=document.getElementById('ctempo'),cmudo=document.getElementById('cmudo');
let L=null; // a ligação em andamento
let VOZ_ESC='';fetch(SUPA+'/rest/v1/escritorio_vozes?select=voz&agente=eq.'+AG,{headers:{apikey:KEY}}).then(r=>r.json()).then(j=>{if(j&&j[0])VOZ_ESC=j[0].voz}).catch(()=>{});
const cfase=(f,t,d)=>{if(!L)return;L.fase=f;callEl.className=f;cest.textContent=t;cdica.textContent=d||''};
function bip(freq,dur,vol){if(!L||!L.ctx)return;try{const o=L.ctx.createOscillator(),g=L.ctx.createGain();o.frequency.value=freq;g.gain.setValueAtTime(vol||.07,L.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,L.ctx.currentTime+dur);o.connect(g);g.connect(L.ctx.destination);o.start();o.stop(L.ctx.currentTime+dur)}catch(e){}}
async function telaAcesa(){try{if(L&&'wakeLock' in navigator&&document.visibilityState==='visible')L.wake=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(L&&document.visibilityState==='visible'){telaAcesa();if(L.ctx&&L.ctx.state!=='running')L.ctx.resume().catch(()=>{})}});
async function ligar(){
  if(L||ocupado)return;const tipo=tipoAudio();
  if(tipo===null){aviso.textContent='ESTE NAVEGADOR NÃO GRAVA ÁUDIO';setTimeout(()=>{aviso.textContent=''},4000);return}
  const C=window.AudioContext||window.webkitAudioContext;
  L={ctx:new C(),tipo,fase:'',mudo:false,ini:Date.now(),fila:null,fonte:null,gen:0,msgsIni:null};
  document.body.classList.add('ligado');cfase('','CONECTANDO');telaAcesa();
  try{L.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}
  catch(e){cfase('','MICROFONE BLOQUEADO','Libere o microfone para este site nas configurações do navegador.');setTimeout(desligar,3500);return}
  if(!L)return;
  const src=L.ctx.createMediaStreamSource(L.stream);L.an=L.ctx.createAnalyser();L.an.fftSize=1024;src.connect(L.an);L.buf=new Float32Array(L.an.fftSize);
  L.relogio=setInterval(()=>{if(L)ctempo.textContent=mmss((Date.now()-L.ini)/1000)},1000);
  const agora=Date.now(),ultima=H.msgs.length?H.msgs[H.msgs.length-1].t:0;
  if(!H.ini||agora-ultima>PAUSA)H.ini=new Date(agora).toISOString();
  bip(660,.18);setTimeout(()=>bip(880,.22),190);
  L.piso=.006;setTimeout(ouvirL,450);
}
function desligar(){
  if(!L)return;const l=L;L=null;l.gen++;
  clearInterval(l.relogio);clearInterval(l.vad);try{l.rec&&l.rec.state!=='inactive'&&l.rec.stop()}catch(e){}
  if(l.ctl)try{l.ctl.abort()}catch(e){}
  try{l.fonte&&l.fonte.stop()}catch(e){}
  try{l.stream&&l.stream.getTracks().forEach(t=>t.stop())}catch(e){}
  try{l.wake&&l.wake.release()}catch(e){}
  setTimeout(()=>{try{l.ctx.close()}catch(e){}},400);
  document.body.classList.remove('ligado');callEl.className='';ctempo.textContent='LIGANDO...';status('ONLINE');ocupado=false;ajusta();desenha()}
function nivelMic(){L.an.getFloatTimeDomainData(L.buf);let q=0;for(const x of L.buf)q+=x*x;return Math.sqrt(q/L.buf.length)}
// ouve até você parar de falar (percebe o silêncio sozinha)
function ouvirL(){
  if(!L)return;const g=++L.gen;
  if(L.mudo){cfase('','MICROFONE MUDO','Toque no microfone para voltar a falar.');return}
  cfase('ouvindo','PODE FALAR','');
  let pedacos=[],rec=null,falou=0,silencio=0,inicioFala=0,acima=0;
  const novo=()=>{pedacos=[];rec=L.tipo?new MediaRecorder(L.stream,{mimeType:L.tipo,audioBitsPerSecond:32000}):new MediaRecorder(L.stream);L.rec=rec;rec.ondataavailable=e=>{if(e.data&&e.data.size)pedacos.push(e.data)};rec.start(250);L.recIni=Date.now()};
  novo();
  clearInterval(L.vad);
  L.vad=setInterval(()=>{
    if(!L||L.gen!==g){return}
    const v=nivelMic(),lim=Math.max(.018,L.piso*3.2);
    callEl.style.setProperty('--nv',Math.min(1,v/(lim*3)).toFixed(2));
    if(!falou){
      L.piso=L.piso*.97+Math.min(v,.05)*.03; // aprende o barulho do carro
      if(v>lim){acima+=50;if(acima>=150){falou=1;inicioFala=Date.now();silencio=0;cdica.textContent='Ouvindo...'}}else acima=0;
      // sem fala por muito tempo: recomeça a gravação para não acumular silêncio
      if(!falou&&Date.now()-L.recIni>15000){const r=rec;r.onstop=null;try{r.stop()}catch(e){}novo()}
    }else{
      if(v<lim*.75)silencio+=50;else silencio=0;
      const dur=Date.now()-inicioFala;
      if((silencio>=1300&&dur>500)||dur>45000){clearInterval(L.vad);fechaFala(rec,()=>pedacos,g)}
    }},50);
}
function fechaFala(rec,pegaPedacos,g){
  bip(520,.12,.05);cfase('pensando','ENTENDENDO...','');
  rec.onstop=async()=>{
    if(!L||L.gen!==g)return;
    const blob=new Blob(pegaPedacos(),{type:(rec.mimeType||'audio/webm').split(';')[0]});
    let texto='';try{const r=await fetch(FN_TR,{method:'POST',headers:{'Content-Type':blob.type||'audio/webm'},body:blob});const j=await r.json();texto=String(j.texto||'').trim()}catch(e){}
    if(!L||L.gen!==g)return;
    if(!texto||texto.length<2){ouvirL();return} // barulho: volta a ouvir
    perguntaL(texto,g)};
  try{rec.stop()}catch(e){rec.onstop()}
}
const abrev=t=>t.replace(/\bDra\./g,'Doutora').replace(/\bDr\./g,'Doutor').replace(/\bSra\./g,'Senhora').replace(/\bSr\./g,'Senhor').replace(/\s&\s/g,' e ').replace(/R\$\s?/g,'').replace(/https?:\/\/\S+/g,'');
function vozDe(t){return fetch(FN_VOZ,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agente:AG,texto:t,voz:VOZ_ESC||undefined})}).then(r=>r.ok?r.arrayBuffer():null).then(b=>b&&L?L.ctx.decodeAudioData(b):null).catch(()=>null)}
function falaL(f,t){t=abrev(t).trim();if(!t||!L||L.fila!==f)return;f.itens.push(vozDe(t));if(!f.tocando)tocaL(f)}
async function tocaL(f){if(!L||L.fila!==f)return;const p=f.itens.shift();if(!p){f.tocando=false;if(f.acabou)fimFalaL(f);else cfase('pensando','TRABALHANDO...','Ela está consultando. Já responde.');return}f.tocando=true;
  const b=await p;if(!L||L.fila!==f)return;if(!b){tocaL(f);return}
  if(L.ctx.state!=='running')try{await L.ctx.resume()}catch(e){}
  const s=L.ctx.createBufferSource();s.buffer=b;s.connect(L.ctx.destination);L.fonte=s;
  if(L.fase!=='falando')cfase('falando','VANESSA FALANDO','Toque na tela para interromper.');
  s.onended=()=>{if(L&&L.fonte===s)L.fonte=null;tocaL(f)};s.start()}
function fimFalaL(f){if(!L||L.fila!==f)return;L.fila=null;if(L.tchau){setTimeout(desligar,300);return}setTimeout(()=>{if(L&&!L.fila)ouvirL()},250)}
async function perguntaL(texto,g){
  if(!L)return;const agora=Date.now();
  if(!H.msgs.length)lista.innerHTML='';
  const msg={role:'user',content:texto,t:agora,lig:1};H.msgs.push(msg);salva();memAdd('u','(ligação) '+texto);
  L.tchau=/^(tchau|at[eé] (mais|logo|amanh[aã]|depois)|pode desligar|desliga|valeu,? tchau|falou,? tchau|beijo,? tchau)\b/i.test(texto);
  cfase('pensando','PENSANDO...','“'+texto.slice(0,110)+(texto.length>110?'…':'')+'”');
  const desde=Date.parse(H.ini);
  const enviar=H.msgs.filter(m=>m.t>=desde).slice(-20).map(m=>({role:m.role,content:m.role==='user'?m.content:(m.fala||'')+(m.usou&&m.usou.length?'\n(ferramentas usadas: '+m.usou.join(', ')+')':'')+(m.telas||[]).map(j=>'\n\n(Deixei no chat, no cartão "'+j.titulo+'":)\n'+j.texto).join('')}));
  const ctl=new AbortController();L.ctl=ctl;const f={itens:[],tocando:false,acabou:false};L.fila=f;
  let fala='',pend='',quadro=null;const telas=[],usadas=[];
  try{
    const r=await fetch(FN_AGENTE,{method:'POST',signal:ctl.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({agente:AG,canal:'ligacao',interlocutor:'Jonathan',pessoa:PESSOA,inicio:H.ini,sala:'ligação pelo celular',mensagens:enviar,stream:true})});
    if(!r.ok||!r.body)throw new Error('sem resposta');
    const rd=r.body.getReader(),dec=new TextDecoder();
    for(;;){const {value,done}=await rd.read();if(!L||L.ctl!==ctl)return;if(done)break;let t='';
      for(const ch of dec.decode(value,{stream:true})){
        if(quadro!==null){if(ch==='\u001f'){try{const j=JSON.parse(quadro);if(j.usou)usadas.push(...j.usou);else telas.push(j)}catch(e){}quadro=null}else quadro+=ch}
        else if(ch==='\u001e')quadro='';else t+=ch}
      fala+=t;pend+=t;let m;
      while((m=pend.match(/^([\s\S]*?[.!?…])\s+/))&&m[1].trim().length>=8){falaL(f,m[1]);pend=pend.slice(m[0].length)}}
    L.ctl=null;if(pend.trim())falaL(f,pend);fala=fala.trim();
    if(!fala&&!telas.length)throw new Error('vazio');
    const usou=[...new Set(usadas)];H.msgs.push({role:'assistant',fala,telas,usou,t:Date.now()});salva();
    memAdd('a',fala+(usou.length?'\n(ferramentas usadas: '+usou.join(', ')+')':'')+telas.map(j=>'\n\n(Deixei no chat, no cartão "'+j.titulo+'":)\n'+j.texto).join(''));
    f.acabou=true;if(!f.tocando&&!f.itens.length)fimFalaL(f);
  }catch(e){
    if(e.name==='AbortError'||!L)return;L.ctl=null;L.fila=null;H.msgs.pop();salva();
    cfase('pensando','SEM CONEXÃO','Tentando de novo quando você falar.');bip(300,.3,.06);setTimeout(()=>{if(L)ouvirL()},1800)}
}
// tocar na tela enquanto ela fala ou pensa: interrompe e volta a ouvir
callEl.addEventListener('pointerdown',e=>{if(!L||e.target.closest('.cb2'))return;
  if(L.fase==='falando'||L.fase==='pensando'){L.gen++;if(L.ctl){try{L.ctl.abort()}catch(_){}L.ctl=null}L.fila=null;try{L.fonte&&L.fonte.stop()}catch(_){}L.fonte=null;L.tchau=false;ouvirL()}});
document.getElementById('cdesl').onclick=()=>{bip(440,.25);desligar()};
cmudo.onclick=()=>{if(!L)return;L.mudo=!L.mudo;cmudo.classList.toggle('on',L.mudo);
  if(L.mudo){if(L.fase==='ouvindo'){L.gen++;clearInterval(L.vad);try{L.rec.onstop=null;L.rec.stop()}catch(e){}cfase('','MICROFONE MUDO','Toque no microfone para voltar a falar.')}}
  else if(!L.fila&&L.fase!=='pensando')ouvirL()};
document.getElementById('ligar').onclick=ligar;

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
desenha();ajusta();
</script>
